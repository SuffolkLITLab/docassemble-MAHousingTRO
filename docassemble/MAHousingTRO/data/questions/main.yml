id: introduction to interview
continue button field: temporary_restraining_order_intro
question: |
  Introduction
subquestion: |
  This interview will help you ask the court for a verified complaint and request for emergency relief. 
  
  This form will also help you issue a Temporary Restraining Order, Short Order of Notice and request the Court for a Preliminary Injunction. 
  
  To use this form, two things must be true:

  1. This must be an **emergency**
  2. Your landlord must have acted **without a court order**

  Examples of this include:

  * Illegally locking you out of your home
  * Shutting off or not turning back on your utilities (water, gas, electric)
  * Not making emergency repairs to your home
  * Keeping your belongings form you
  
  Before you get started, please gather the following if you can:
  
  * Your lease 
  * Photos or receipts about what happened
  * Board of Health report (if you have one)
  * Proof of income (to ask the court to waive the fees)
  * Your landlord's information such as their contact information and address

  If you do not have any of the above, you can still start the interview without them.
  
  When you are finished, you will need to:
  
  **Print, sign, and bring the forms to the court today.** This interview **does not give legal advice** and does not **file any of the forms for you.**

  Most people take about 15-20 minutes to complete this interview.
