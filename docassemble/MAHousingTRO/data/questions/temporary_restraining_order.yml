---
# ALDocument objects specify the metadata for each template
objects:
  - temporary_restraining_order_Post_interview_instructions: ALDocument.using(title="Instructions", filename="temporary_restraining_order_next_steps.docx", enabled=True, has_addendum=False)
  - temporary_restraining_order_attachment: ALDocument.using(title="Temporary Restraining Order", filename="temporary_restraining_order", enabled=True, has_addendum=False)
---
# Bundles group the ALDocuments into separate downloads, such as for court and for the user
objects:
  - al_user_bundle: ALDocumentBundle.using(elements=[temporary_restraining_order_Post_interview_instructions, temporary_restraining_order_attachment], filename="temporary_restraining_order_user_bundle", title="All forms to download for your records", enabled=True)
  - al_court_bundle: ALDocumentBundle.using(elements=[temporary_restraining_order_attachment], filename="temporary_restraining_order_court_bundle", title="All forms to deliver to court", enabled=True)
---
# Each attachment defines a key in an ALDocument. We use `i` as the placeholder here so the same template is 
# used for "preview" and "final" keys, and logic in the template checks the value of 
# `i` to show or hide the user's signature
attachment:
  name: Post-interview-Instructions
  filename: temporary_restraining_order_next_steps
  docx template file: temporary_restraining_order_next_steps.docx
  variable name: temporary_restraining_order_Post_interview_instructions[i]
  skip undefined: True
  tagged pdf: True
---
