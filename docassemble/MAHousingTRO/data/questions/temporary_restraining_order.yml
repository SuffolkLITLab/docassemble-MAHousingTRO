---
terms: 
  bond: |
    A cash deposit or a promise to pay. 
---
id: Security Waiver
question: |
  Would you like to ask the Court waive the security requirement?
subquestion: |
  If the judge says yes to your request, you usually have to pay some money to the court first. This is called a {bond}. The court holds onto this money in case it turns out later that you shouldn't have gotten the temporary restraining order. 
  
  There's no set amount. The judge decides how much, based on your case.

fields:
  - "Would you like to ask the court to waive this bond?": waiver_yes_no
    datatype: yesnoradio
  - "Why do you want this waiver?": plaintiff_waiver_request
    input type: area
    show if: waiver_yes_no
    help: |
      For example: you may not have enough money right now, or paying this amount would cause you hardship. 
