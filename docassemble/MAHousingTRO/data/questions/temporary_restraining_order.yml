---
id: temporary restraining order review screen
event: review_temporary_restraining_order
question: |
  Review your answers
review:
  - Edit: plaintiffs.revisit
    button: |
      **Plaintiffs**

      % for item in plaintiffs:
        * ${ item }
      % endfor
  - Edit: trial_court
    button: |
      **Trial court**
  
      % if defined("trial_court.phone"):
      * phone_number: ${ trial_court.phone }
      % endif
      % if defined("trial_court.address.address"):
      * address: ${ trial_court.address.block() }
      % endif
      % if defined("trial_court.division"):
      * division: ${ trial_court.division }
      % endif
  - Edit: docket_number
    button: |
      **docket number **:
      ${ docket_number }
  - Edit: plaintiff_waiver_request
    button: |
      **Reason for waiver request**:
      > ${ single_paragraph(plaintiff_waiver_request) }
  - Edit: plaintiff_request
    button: |
      **Request from plaintiff**:
      > ${ single_paragraph(plaintiff_request) }
  - Edit: defendants.revisit
    button: |
      **Defendants**

      % for item in defendants:
        * ${ item }
      % endfor
---
id: edit plaintiffs
continue button field: plaintiffs.revisit
question: |
  Edit plaintiffs
subquestion: |
  ${ plaintiffs.table }

  ${ plaintiffs.add_action() }
---
table: plaintiffs.table
rows: plaintiffs
columns:
  - Signature: |
      row_item.signature if defined("row_item.signature") else ""
  - Name: |
      row_item.name_full() if defined("row_item.name.first") else ""
  - Address: |
      row_item.address.block() if defined("row_item.address.address") else ""
  - Phone number: |
      row_item.phone_number if defined("row_item.phone_number") else ""
edit:
  - plaintifs[0].signature
  - plaintifs[0].name.first
  - plaintifs[0].address.address
  - plaintifs[0].phone_number
confirm: True
---
id: edit defendants
continue button field: defendants.revisit
question: |
  Edit defendants
subquestion: |
  ${ defendants.table }

  ${ defendants.add_action() }
---
table: defendants.table
rows: defendants
columns:
  - Name: |
      row_item.name_full() if defined("row_item.name.first") else ""
edit:
  - name.first
confirm: True
---
id: Sign Your Document
code: |
  signature_fields = ["plaintiffs[0].signature"]
---
id: preview temporary_restraining_order
question: |
  Preview your form. 
subquestion: |
  Here is a preview of the form.   
  
  ${ al_court_bundle.as_pdf(key='preview') }

  Click the image to open it in a new browser tab. Click the "Edit answers" button
  to edit your answers.

  ${ action_button_html(url_action('review_temporary_restraining_order'), label='Edit answers', color='info') }
  
  If you are happy with the document, go to the next page to download your document.
continue button field: temporary_restraining_order_preview_question
---
id: download temporary_restraining_order
event: temporary_restraining_order_download
question: |
  All done
subquestion: |
  Thank you ${users}. Your form is ready to download and deliver.
  
  View, download and send your form below. Click the "Edit answers" button to fix any mistakes.

  ${ action_button_html(url_action('review_temporary_restraining_order'), label='Edit answers', color='info') }
  
  
  ${ al_user_bundle.download_list_html() }
  

  ${ al_user_bundle.send_button_html(show_editable_checkbox=True) }

progress: 100
---
# ALDocument objects specify the metadata for each template
objects:
  - temporary_restraining_order_Post_interview_instructions: ALDocument.using(title="Instructions", filename="temporary_restraining_order_next_steps.docx", enabled=True, has_addendum=False)
  - temporary_restraining_order_attachment: ALDocument.using(title="Temporary Restraining Order", filename="temporary_restraining_order", enabled=True, has_addendum=False, )
---
# Bundles group the ALDocuments into separate downloads, such as for court and for the user
objects:
  - al_user_bundle: ALDocumentBundle.using(elements=[temporary_restraining_order_Post_interview_instructions, temporary_restraining_order_attachment], filename="temporary_restraining_order", title="All forms to download for your records", enabled=True)
  - al_court_bundle: ALDocumentBundle.using(elements=[temporary_restraining_order_attachment],  filename="temporary_restraining_order", title="All forms to deliver to court", enabled=True)
---
# Each attachment defines a key in an ALDocument. We use `i` as the placeholder here so the same template is 
# used for "preview" and "final" keys, and logic in the template checks the value of 
# `i` to show or hide the user's signature
attachment:
  name: Post-interview-Instructions
  filename: temporary_restraining_order_next_steps
  docx template file: temporary_restraining_order_next_steps.docx
  variable name: temporary_restraining_order_Post_interview_instructions[i]
  skip undefined: True
  tagged pdf: True
---
attachment:
  name: temporary restraining order
  filename: temporary_restraining_order
  variable name: temporary_restraining_order_attachment[i]
  skip undefined: True
  docx template file: temporary_restraining_order.docx
  tagged pdf: True