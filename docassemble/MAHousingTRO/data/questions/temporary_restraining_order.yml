    This interview will help you ask the court for a Temporary Restraining Order.

    Before you get started, please gather:

    1. Your lease or rental agreement, if you have one
    1. The other party's name, address, phone number, and email
    1. Photos, videos, texts, or letters that show the problem
    1. Your docket number, if the court already gave you one

