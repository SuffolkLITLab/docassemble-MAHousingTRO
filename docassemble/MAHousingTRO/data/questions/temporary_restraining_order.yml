  immediate danger: |
    If you see smoke, smell gas, or notice large cracks in the cieling or floors. 
---
id: temporary restraining order intro
continue button field: temporary_restraining_order_intro
question: |
  What does this interview do?
subquestion: |
  This interview will help you file a Temporary Restraining Order with the Housing Court.

  If you are in {immediate danger}, click this button to find emergency housing resources. 

  ${ btn_emergency_housing }
  
  ## Can you use this form?
  1. Are you facing a {housing emergency}?
  2. Will you suffer serious harm if you have to wait any longer for your problem to be fixed?

  If you answered yes to the above questions, you may continue. 
 
  ### What to gather before you start
 
  * The lease or rental agreement, if you have one
  * The other party's name, address, phone number, and email
  * Photos, videos, text messages, or letters that show the problem
  * The date and time the problem started
  * Your docket number, if the court already gave you one
 
  If you do not have all of this, you can still start the interview. Most
  people take about 10 minutes to finish.
 
  #### After you finish this interview
 
  1. Print and sign your forms.
  2. Bring them to the Housing Court clerk's office for the county where the home is.
  3. Ask the clerk to bring your papers to a judge today.
  4. Be ready to tell the judge why you cannot wait.
  
  ${ collapse_template(not_right_form_template) }
---
template: not_right_form_template
subject: |
  Not the right form for you?
content: |
  If you need help but this is not an emergency situation, click the button to find a lawyer who may better assist you. 

  ${ btn_legal_services } 
---
id: What is a TRO?
continue button field: what_is_a_tro
question: |
  What is a Temporary Restraining Order?
subquestion: |
  A Temporary Restraining Order (TRO) is an emergency court order telling the other party to stop doing something illegal or to fix a dangerous problem in the home right away. 

  **How long does it last?** A temporary restraining order will last only **10 days**. 
  
  **What happens after the 10 days?**
  After that, both parties will need to go to a court hearing where you can request a preliminary injunction if you need a longer restraining order. 

  ${ collapse_template(extend_a_tro_template) }
---
template: extend_a_tro_template
subject: |
  Can you extend a TRO?
content: |
  A judge can extend it for another 10 days if there is a good reason or if your landlord agrees to extend it. You may also request a preliminary injunction which lasts longer than the 10 days. 
