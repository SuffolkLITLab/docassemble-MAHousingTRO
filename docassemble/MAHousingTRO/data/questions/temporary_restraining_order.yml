id: your contact information
section: your_information
question: |
  % if al_person_answering == "user":
  What is your contact information?
  % else:
  What is ${ users[0] }'s contact information?
  % endif
subquestion: |
  % if al_person_answering == "user":
  Include at least **one** way to reach you other than by mail.
  % else:
  Include at least **one** way to reach ${ users[0] } other than by mail.
  % endif

  ${ collapse_template(why_contact_info_needed_template) }
fields:  
  - Phone number: users[0].phone_number
    required: False
    datatype: al_international_phone
  - Email address: users[0].email    
    datatype: email
    required: False
  - label: |
      % if al_person_answering == "user":
      Other ways to reach you
      % else:
      Other ways to reach ${ users[0] }
      % endif
    field: users[0].other_contact_method
    input type: area
    required: False
    help: |
      If you do not have a phone number or email, tell us how to reach you.
      For example, you can use a friend's phone number. But it must be a
      friend you trust to give you the message.
validation code: |
  if (
    not showifdef("users[0].phone_number")
    and (not showifdef("users[0].mobile_number"))
    and (not showifdef("users[0].email"))
    and (not showifdef("users[0].other_contact_method"))
  ):
    validation_error(
      word("You need to provide at least one contact method."),
      field="users[0].other_contact_method",
    )
---
id: party type
question: |
  Are you a landlord or a tenant?
fields:
  - no label: party_type
    datatype: radio
    choices:
      - Landlord: landlord
      - Tenant: tenant
---
code: |
  if party_type == 'landlord':
      plaintiff_label = 'landlord'
      defendant_label = 'tenant'
  else:
      plaintiff_label = 'tenant'
      defendant_label = 'landlord'
  roles_assigned = True
---
id: plaintiff request
question: |
  What are you asking the court to do?
subquestion: |
  Explain exactly what you want the judge to order the **${ defendant_label }**
  to do or stop doing.
fields:
  - Your request: plaintiff_request
    input type: area
---
sets:
  - other_parties[i].name.first
  - other_parties[i].name.last
  - other_parties[i].name.middle
  - other_parties[i].name.suffix
id: names of opposing parties
question: |
  % if user_started_case:
  Name of the **${ defendant_label }** in this matter
  % else:
  Name of the **${ plaintiff_label }** in this matter
  % endif
fields:
  - code: |
      other_parties[i].name_fields(person_or_business="unsure")
---
terms: 
  bond: |
    A cash deposit or a promise to pay. 
---
id: Security Waiver
question: |
  Do you want to ask the court to waive the security requirement?
subquestion: |
  If the judge says yes to your request, you usually have to pay some money to
  the court first. This is called a {bond}. The court holds the money in case
  it turns out later that you should not have gotten the order.
  
  There is no set amount. The judge decides how much, based on your case.

fields:
  - "Do you want to ask the court to waive this bond?": waiver_yes_no
    datatype: yesnoradio
  - "Why do you want this waiver?": plaintiff_waiver_request
    input type: area
    show if: waiver_yes_no
    help: |
      For example: you may not have enough money right now, or paying this
      amount would be a hardship for you.
---
id: affirmation and oath of no perjury
question: |
  Signing under oath 
subquestion: |
  You must sign this form under oath. That means everything you say must be
  true, as far as you know.
fields:
  - no label: users[i].states_above_true
    datatype: checkboxes
    minlength: 1
    choices:
      - I affirm that the answers I have given are true, under the penalties of perjury: states_true
    validation messages:
      minlength: |
        You cannot keep going unless you did your best to tell the truth.
---
code: |
