terms:
  housing emergency: |
    You are locked out of your home. Or your utilities are shut off. Or your
    home is not safe or clean enough to live in.
  immediate danger: |
    You see smoke, smell gas, or notice large cracks in the ceiling or floors.
---
id: temporary restraining order intro
continue button field: temporary_restraining_order_intro
question: |
  What does this interview do?
subquestion: |
  This interview helps you ask the Housing Court for a temporary restraining
  order.

  If you are in {immediate danger}, use this button to find emergency housing
  help.

  ${ btn_emergency_housing }
  
  #### Can you use this form?

  1. Are you facing a {housing emergency}?
  2. Will you be seriously harmed if you have to wait any longer to fix it?

  If you answered yes to both questions, you can go on.
 
  #### What to gather before you start
 
  * The lease or rental agreement, if you have one
  * The other party's name, address, phone number, and email
  * Photos, videos, text messages, or letters that show the problem
  * The date and time the problem started
  * Your docket number, if the court already gave you one
 
  You can still start without all of this. Most people finish in about 10
  minutes.
 
  #### After you finish this interview
 
  1. Print and sign your forms.
  2. Bring them to the Housing Court clerk's office for the county where the home is.
  3. Ask the clerk to bring your papers to a judge today.
  4. Be ready to tell the judge why you cannot wait.
  
  ${ collapse_template(not_right_form_template) }
---
template: not_right_form_template
subject: |
  Not the right form for you?
content: |
  Is this not an emergency? A lawyer may be able to help you instead.

  ${ btn_legal_services } 
---
id: What is a TRO?
continue button field: what_is_a_tro
question: |
  What is a Temporary Restraining Order?
subquestion: |
  A temporary restraining order (TRO) is an emergency court order. It tells
  the other party to stop breaking the law or to fix a danger in the home
  right away.

  **How long does it last?**

  Only 10 days.

  **What happens next?**

  Both sides go to a court hearing. There you can ask for a preliminary
  injunction if you need more time.

  ${ collapse_template(extend_a_tro_template) }
---
template: extend_a_tro_template
subject: |
  Can you extend a TRO?
content: |
  A judge can add 10 more days if there is a good reason. The other party can
  also agree to give you more time. You can also ask for a preliminary
  injunction, which lasts longer than 10 days.
